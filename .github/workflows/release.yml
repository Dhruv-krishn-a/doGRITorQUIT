name: Release gritorquit Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify Build + Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck notes package
        run: pnpm --filter @gritorquit/notes-ui-web build

      - name: Build desktop frontend
        run: pnpm --filter desktop build

      - name: Validate release tag matches desktop version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION="$(node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('apps/desktop/src-tauri/tauri.conf.json','utf8'));process.stdout.write(c.version)")"
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "Tag/version mismatch: tag=$TAG_VERSION, tauri.conf.json=$APP_VERSION"
            echo "Update apps/desktop/src-tauri/tauri.conf.json version before tagging."
            exit 1
          fi


  linux-tauri:
    name: Build Linux Bundles (.deb/.rpm/.AppImage)
    needs: verify
    runs-on: ubuntu-22.04
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      VITE_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      VITE_APP_ENV: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux bundles
        run: pnpm --filter desktop tauri build --bundles deb,rpm,appimage

      - name: Upload Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: linux-tauri-bundles
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/**/*.rpm
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/desktop
            apps/desktop/src-tauri/target/release/gritorquit
            apps/desktop/dist/**
          if-no-files-found: error

  desktop-auth-matrix:
    name: Desktop Auth Matrix (online/offline build checks)
    needs: verify
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        mode: [online, offline]
    env:
      VITE_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop in ${{ matrix.mode }} mode
        env:
          VITE_APP_ENV: ${{ matrix.mode == 'online' && 'production' || 'staging' }}
        run: pnpm --filter desktop build

  arch-pacman:
    name: Build Arch Package (.pkg.tar.zst)
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build Arch package in Arch container
        uses: addnab/docker-run-action@v3
        with:
          image: archlinux:latest
          options: -v ${{ github.workspace }}:/work
          run: |
            set -euo pipefail
            pacman-key --init
            pacman-key --populate archlinux
            pacman -Sy --noconfirm archlinux-keyring
            pacman -S --noconfirm --needed base-devel nodejs npm pnpm rust gtk3 webkit2gtk-4.1 ttf-dejavu
            
            useradd -m builder
            chown -R builder:builder /work
            cd /work
            
            # Run the build natively on Arch to ensure binary compatibility
            su builder -c "bash -lc 'cd /work && \
              export VITE_SUPABASE_URL=\"${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}\" && \
              export VITE_SUPABASE_ANON_KEY=\"${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}\" && \
              export VITE_APP_ENV=production && \
              pnpm install --frozen-lockfile && \
              pnpm --filter desktop tauri build --no-bundle && \
              ./scripts/build-arch-package.sh \"/work/apps/desktop/src-tauri/target/release/desktop\" \"/work/apps/desktop/dist\"'"

      - name: Upload Arch package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: |
            packaging/arch/*.pkg.tar.zst
            packaging/arch/PKGBUILD
            packaging/arch/gritorquit.desktop
          if-no-files-found: error

  mobile-android:
    name: Build Android APK
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Android APK
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_API_URL: "https://www.dogritorquit.in"
        run: ./scripts/build-mobile-apk.sh --skip-install --no-clean-prebuild --skip-gradle-clean

      - name: Upload APK bundle
        uses: actions/upload-artifact@v4
        with:
          name: mobile-apk-bundle
          path: apps/mobile/dist/*.apk
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [linux-tauri, arch-pacman, desktop-auth-matrix, mobile-android]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux bundles
        uses: actions/download-artifact@v4
        with:
          name: linux-tauri-bundles
          path: dist/release/linux

      - name: Download Arch package
        uses: actions/download-artifact@v4
        with:
          name: arch-package
          path: dist/release/arch

      - name: Download Mobile APK
        uses: actions/download-artifact@v4
        with:
          name: mobile-apk-bundle
          path: dist/release/mobile

      - name: Organize and Rename Assets
        run: |
          set -euo pipefail
          mkdir -p dist/release/final
          
          # Rename Linux Desktop bundles
          for file in $(find dist/release/linux -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \)); do 
            mv "$file" "dist/release/final/desktop-linux-$(basename "$file")"
          done
          
          # Rename Arch Linux Desktop package
          for file in $(find dist/release/arch -type f -name "*.pkg.tar.zst"); do 
            mv "$file" "dist/release/final/desktop-archlinux-$(basename "$file")"
          done
          
          # Cleanly name the Mobile APK with version
          VERSION="${GITHUB_REF_NAME#v}"
          for file in $(find dist/release/mobile -type f -name "*.apk"); do 
            mv "$file" "dist/release/final/mobile-android-v${VERSION}.apk"
          done
          
          # Move extra files (like PKGBUILD) with prefix
          for file in $(find dist/release/arch -type f \( -name "PKGBUILD" -o -name "gritorquit.desktop" \)); do 
            mv "$file" "dist/release/final/arch-source-$(basename "$file")"
          done

      - name: Build checksums
        run: |
          set -euo pipefail
          cd dist/release/final
          find . -type f -print0 | sort -z | xargs -0 sha256sum > sha256sum.txt

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_REPO_TOKEN }}
          repository: Dhruv-krishn-a/dogritorquit-releases
          tag_name: ${{ github.ref_name }}
          name: gritorquit ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/release/final/*
